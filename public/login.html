<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextEpisode - Login</title>
  <link rel="stylesheet" href="css/style.css" />

  <style>
    body {
      background-color: #0d0e12;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background-color: #1a1c24;
      padding: 2.5rem;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: #fff;
    }

    .logo-next {
      color: #e50914;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #b3b3b3;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 4px;
      border: 1px solid #333;
      background-color: #2a2d3a;
      color: #fff;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background-color: #e50914;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 1rem;
    }

    button:hover {
      background-color: #b80710;
    }

    .error-msg {
      color: #e50914;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <h2><span class="logo-next">Next</span>Episode Login</h2>
    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="off" autocapitalize="off" autocorrect="off"
          spellcheck="false" required placeholder="seu@email.com" />
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" autocomplete="new-password" required placeholder="Sua senha" />
      </div>
      <button type="submit">ENTRAR NO SISTEMA</button>
      <div id="erro" class="error-msg"></div>
    </form>
  </div>

  <script>
    document
      .getElementById("loginForm")
      .addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const senha = document.getElementById("senha").value;
        const erroDiv = document.getElementById("erro");

        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, senha }),
          });

          const dados = await response.json();

          if (!response.ok) {
            throw new Error(dados.erro || "Erro ao fazer login.");
          }

          localStorage.setItem("@NextEpisode:token", dados.token);
          localStorage.setItem(
            "@NextEpisode:usuario",
            JSON.stringify(dados.usuario),
          );

          window.location.href = "/index.html";
        } catch (error) {
          erroDiv.textContent = error.message;
          erroDiv.style.display = "block";
        }
      });
  </script>
</body>

</html>
